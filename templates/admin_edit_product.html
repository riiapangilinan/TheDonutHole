{% extends "base.html" %}

{% block content %}
<section class="section" aria-label="Manage Products" style="padding: 40px 0; margin-top: 130px;">
  <div class="container" style="max-width: 1200px;">
    <p class="section-subtitle text-center label-2" style="color: #6c757d;">Manage Products</p>
    <h2 class="headline-1 section-title text-center" style="margin-bottom: 30px;">Admin Product Panel</h2>
    
    <div class="container" style="max-width: 1200px;">
      <h2 class="headline-1 section-title text-center">Edit Product</h2>

      <!-- Form for editing product details -->
      <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}" enctype="multipart/form-data">
        <div class="form-group mb-3">
          <label for="name">Product Name</label>
          <input type="text" name="name" class="form-control mb-3" value="{{ product.name }}" required 
                 style="border:none; border-bottom:1px solid #ced4da; border-radius:0; padding:8px 4px;">
        </div>
        <div class="form-group mb-3">
          <label for="price">Price (₱)</label>
          <input type="number" step="0.01" name="price" class="form-control mb-3" value="{{ product.price }}" required 
                 style="border:none; border-bottom:1px solid #ced4da; border-radius:0; padding:8px 4px;">
        </div>
        <div class="form-group mb-3">
          <label for="stock_quantity">Stock Quantity</label>
          <input type="number" name="stock_quantity" class="form-control mb-3" value="{{ product.stock_quantity }}" required 
                 style="border:none; border-bottom:1px solid #ced4da; border-radius:0; padding:8px 4px;">
        </div>
        <div class="form-group mb-3">
          <label for="description">Description</label>
          <textarea name="description" class="form-control mb-3" rows="3" required 
                    style="border:none; border-bottom:1px solid #ced4da; border-radius:0; padding:8px 4px;">{{ product.description }}</textarea>
        </div>
        <div class="form-group mb-3">
          <label for="image">Image</label>
          <input type="file" name="image" class="form-control mb-3">
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="is_active" id="activeCheck{{ product.id }}" {% if product.is_active %}checked{% endif %}>
          <label class="form-check-label" for="activeCheck{{ product.id }}">Active</label>
        </div>
        <div style="text-align: right;">
          <button type="submit" class="btn btn-primary" style="padding:10px 20px;">Save Changes</button>
          <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary" style="padding:10px 20px;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
